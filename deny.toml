# CI runs `cargo deny check advisories bans sources` (ci.yml, release.yml); licenses are not checked.
[advisories]
ignore = [
  # Marvin timing attack on RSA private-key ops; no patched `rsa` exists. It comes in through
  # bitwarden-crypto. The server picks the ciphertexts, but sees too few decryptions, too coarsely
  # timed, to run the attack (docs/SECURITY.md, Known gaps). Drop when rsa is patched.
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; one RSA decryption per sync or request, far too few timings for the attack (docs/SECURITY.md)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# bitwarden-crypto, pinned by rev (upstream.lock).
allow-git = ["https://github.com/bitwarden/sdk-internal"]
