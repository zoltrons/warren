name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; a job that needs more says so itself.
permissions: {}

# A newer push to the same PR supersedes the running one; main runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Security lint: template injection, unpinned actions, credential persistence, cache poisoning.
      - run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d --offline --min-severity medium .github/workflows

  # Committed secrets, over the whole history; known false positives are listed in .gitleaksignore.
  secrets:
    name: scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install # version, components and wasm target come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: sdk-internal rev in Cargo.toml matches upstream.lock
        run: |
          rev=$(awk '/^\[sdk-internal\]/{s=1} s&&/^rev/{gsub(/"/,"",$3); print $3; exit}' upstream.lock)
          test "$(grep -c "rev = \"$rev\"" crates/core-wasm/Cargo.toml)" -ge 1
      # Same command as locally (tools/verify.mjs): fmt, clippy, crypto test vectors, autofill engine tests.
      - run: node tools/verify.mjs rust
        env: { GH_TOKEN: "${{ github.token }}" }

  # RustSec / npm advisories can go red on an unchanged tree when a new advisory lands, so this
  # job stays out of the `ci` gate: it warns, it does not block merges.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check advisories bans sources }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npm audit --audit-level=high

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-cache also keeps ~/.cargo/bin, and `cargo install` of an already installed version is a no-op.
      - run: cargo install wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "\(.*\)".*/\1/p' upstream.lock)" --locked
      # binaryen (wasm-opt) comes from package-lock.json, integrity-checked like every other tool.
      - run: npm ci && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npx playwright-core install --with-deps chromium
      # Same command as locally (tools/verify.mjs): wasm, typecheck, unit tests (with coverage), contrast, build, size
      # budget (into the step summary), fill/biometric/passkey smoke tests. The e2e builds go to dist/ext-e2e, so the
      # dist/ext uploaded below is a real build.
      - run: node tools/verify.mjs wasm quick ext --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage/lcov.info }
      # The unpacked build of this exact commit, for sideloading when reviewing a PR.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension, path: dist/ext }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: |
            dist/wasm
            dist/wasm-register

  e2e:
    needs: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a healthy run takes ~5 min; a hung browser call must not burn 6 h
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npx playwright-core install --with-deps chromium
      - run: bash dev/vaultwarden/up.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wasm, path: dist }
      # Same command as locally (tools/verify.mjs): test vectors, dist/ext-e2e, every e2e group.
      - run: node tools/verify.mjs e2e
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: vaultwarden logs
        if: failure()
        run: docker compose -f dev/vaultwarden/docker-compose.yml logs --no-color --tail 200

  # Fan-in: branch protection requires only this check, so adding a job means adding it here.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [workflows, secrets, core, extension, e2e]
    if: always()
    steps:
      - name: every blocking job succeeded
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          for r in $RESULTS; do test "$r" = success || { echo "::error::a required job finished as '$r'"; exit 1; }; done
