name: release
# Push a tag v<manifest version> to build the extension and attach a signed .crx, a .zip and the
# updates.xml that installed copies poll (manifest `update_url`) to a GitHub release.
# Needs the CRX_KEY secret: a PEM private key, which fixes the extension id, so keep it
# and never regenerate it:  openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out warren.pem
on:
  push:
    tags: ["v*"]

# Least privilege by default; only the signing job can write a release.
permissions: {}

jobs:
  # Installed copies update themselves, so a tag must never ship a commit that is not on main with a green CI run.
  # Not a check named "ci": a pull request's run posts one on its own commits, and so can anything allowed to write
  # checks. The tagged commit must be on main, and the ci workflow's run for its push to main must have passed.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read }
    steps:
      - name: the commit is on main and the ci workflow passed for its push there
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # main ahead of (or at) the commit: it is in main's history.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          case "$status" in
            ahead | identical) ;;
            *) echo "::error::$GITHUB_SHA is not on main ($status)"; exit 1 ;;
          esac
          while :; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA" --jq '.workflow_runs[0].conclusion // "pending"')"
            case "$conclusion" in
              success) exit 0 ;;
              pending) sleep 30 ;;
              *) echo "::error::ci finished as '$conclusion' on $GITHUB_SHA"; exit 1 ;;
            esac
          done

  # Push access alone cannot ship a release: the tag must be signed by a key in .github/allowed_signers, read from
  # the tagged commit only once ci-passed showed that commit is on main (a branch could list any key).
  tag-signed:
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # A shallow tag checkout can turn an annotated tag into a lightweight one: fetch the tag object itself.
      - run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          bash tools/verify-tag.sh "$GITHUB_REF_NAME"

  # Runs third-party install and build scripts, so it never sees CRX_KEY.
  build:
    needs: [ci-passed, tag-signed]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - run: rustup toolchain install # from rust-toolchain.toml
      - run: cargo install wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "\(.*\)".*/\1/p' upstream.lock)" --locked
      # binaryen (wasm-opt) comes from package-lock.json, integrity-checked like every other tool.
      - run: npm ci && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bash tools/build-wasm.sh --simd
      - run: node tools/fetch-psl.mjs && npm run typecheck && npm test && npm run build && npm run size
      # Advisories warn in ci but block a release: nothing with a known high-severity hole ships.
      - run: npm audit --audit-level=high
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check advisories bans sources }
      - name: tag matches the manifest version
        run: test "v$(node -p "require('./dist/ext/manifest.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: extension, path: dist/ext, if-no-files-found: error }

  # Holds CRX_KEY: installs nothing and runs no package code, only node:crypto (tools/pack-crx.mjs).
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token + attestations: signed SLSA build provenance (Sigstore) for every released file.
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: extension, path: dist/ext }
      # The .crx is the released .zip, signed by tools/pack-crx.mjs on node:crypto alone: no npm package and no
      # browser ever runs next to CRX_KEY, so a compromised dependency cannot read the key.
      - name: pack .crx and .zip
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: |
          test -n "$CRX_KEY" || { echo "::error::CRX_KEY secret is not set"; exit 1; }
          (cd dist/ext && zip -qrX "../../warren-$GITHUB_REF_NAME.zip" .)
          printf '%s\n' "$CRX_KEY" > "$RUNNER_TEMP/key.pem"
          id="$(node tools/pack-crx.mjs "warren-$GITHUB_REF_NAME.zip" "$RUNNER_TEMP/key.pem" "warren-$GITHUB_REF_NAME.crx")"
          rm "$RUNNER_TEMP/key.pem"
          test "$id" = "$(node tools/pack-crx.mjs --verify "warren-$GITHUB_REF_NAME.crx")"
          # A replaced secret would ship a different extension that installed copies never update to.
          test "$id" = nkaabaakdmjjoplnpijkcnpmenphaikf || { echo "::error::CRX_KEY gives extension id $id"; exit 1; }
          # The update manifest the extension's `update_url` points at (releases/latest/download/updates.xml).
          cat > updates.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="$id">
              <updatecheck codebase="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/warren-$GITHUB_REF_NAME.crx" version="${GITHUB_REF_NAME#v}" />
            </app>
          </gupdate>
          XML
      # Verify a download with: gh attestation verify warren-vX.Y.Z.crx --repo zoltrons/warren
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "warren-*.crx\nwarren-*.zip\nupdates.xml" }
      # Release notes are the annotated tag's message (the version's CHANGELOG.md section). Read through the API:
      # a shallow tag checkout can turn an annotated tag into a lightweight one. A lightweight tag fails here.
      - run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          # A signed tag's message ends in its signature block, which is not part of the notes.
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' | sed '/^-----BEGIN SSH SIGNATURE-----$/,$d' > notes.md
          gh release create "$GITHUB_REF_NAME" warren-*.crx warren-*.zip updates.xml --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
